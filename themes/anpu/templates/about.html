{% import "macros/page.html" as page_macros %}
{% extends "index.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}

<article class="post">
    <header>
        <h1>{{ page.title }}</h1>
    </header>
    <div class="about-content">
        <div class="about-text-content">
            {{ page.content | safe }}
        </div>
        {% if page.extra.portrait %}
            <div class="about-portrait">
                <img src="{{ page.extra.portrait }}" alt="">
            </div>
        {% endif %}
    </div>
    {{ page_macros::page_info(page=page) }}
</article>

{% endblock content %}
